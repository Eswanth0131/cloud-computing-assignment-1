<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="AWS Dining Concierge Chatbot">
    <meta name="author" content="NYU Cloud Computing">

    <title>Dining Concierge | NYU Cloud Computing</title>

    <!-- Bootstrap -->
    <link href="./assets/css/bootstrap.min.css" rel="stylesheet">

    <!-- IE10 compatibility -->
    <link href="./assets/css/ie10-viewport-bug-workaround.css" rel="stylesheet">

    <!-- Application styles -->
    <link href="./assets/css/cover.css" rel="stylesheet">
    <link href="./assets/css/main.css" rel="stylesheet">
    <link href="./assets/css/chat.css" rel="stylesheet">

    <!-- AWS SDK -->
    <script src="./assets/js/aws-sdk.min.js"></script>
</head>

<body>

<div class="site-wrapper white">
    <div class="site-wrapper-inner">
        <div class="cover-container">

            <!-- Header -->
            <div class="masthead clearfix">
                <div class="inner">
                    <h3 class="masthead-brand">
                        Dining Concierge
                    </h3>
                </div>
            </div>

            <!-- Chat Interface -->
            <div class="inner">
                <div class="chat">

                    <!-- Messages -->
                    <div class="messages">
                        <div class="messages-content"></div>
                    </div>

                    <!-- Message Input -->
                    <div class="message-box">

                        <textarea
                            class="message-input"
                            placeholder="Ask me about restaurants..."
                            aria-label="Chat message"
                            rows="1"
                        ></textarea>

                        <button
                            type="button"
                            class="message-submit"
                            aria-label="Send message"
                        >
                            Send
                        </button>

                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

<!-- Bootstrap -->
<script src="./assets/js/bootstrap.min.js"></script>

<!-- IE10 compatibility -->
<script src="./assets/js/ie10-viewport-bug-workaround.js"></script>

<!-- Custom Scrollbar -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.3/jquery.mCustomScrollbar.concat.min.js"></script>

<!-- API Gateway Configuration -->
<script>
    window.CHATBOT_API_URL =
        "https://o7xq7t1gi1.execute-api.us-east-1.amazonaws.com/v1/chatbot";
</script>

<!-- Chat Application -->
<script src="./assets/js/chat.js"></script>

</body>
</html>
